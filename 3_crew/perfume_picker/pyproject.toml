[project]
name = "perfume_picker"
version = "0.1.0"
description = "perfume_picker using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.6.1"
]

[project.scripts]
perfume_picker = "perfume_picker.main:run"
run_crew = "perfume_picker.main:run"
train = "perfume_picker.main:train"
replay = "perfume_picker.main:replay"
test = "perfume_picker.main:test"
run_with_trigger = "perfume_picker.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
